<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYAU Cover Page Generator</title>

  <!-- Typst all-in-one (lite) bundle: exposes the global $typst. WASM modules are pointed to the CDN in initCompiler() -->
  <script type="module" id="typst"
    src="https://cdn.jsdelivr.net/npm/@myriaddreamin/typst.ts/dist/esm/contrib/all-in-one-lite.bundle.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #fff;
      max-width: 600px;
      width: 100%;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      color: #7a2e38;
      text-align: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .section-title {
      font-weight: bold;
      color: #7a2e38;
      margin: 18px 0 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #8a3340;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background: #6e2631; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>KYAU Cover Page Generator</h2>

  <div class="form-group">
    <label>Cover Heading</label>
    <input type="text" id="assignmentNo" value="Assignment-02">
  </div>

  <div class="form-group">
    <label>Course Code</label>
    <input type="text" id="courseCode" value="CSE 0611-1102">
  </div>

  <div class="form-group">
    <label>Course Title</label>
    <input type="text" id="courseTitle" value="Computer Applications Lab">
  </div>

  <div class="form-group">
    <label>Label Type</label>
    <select id="labelTitle">
      <option value="Name of the Assignment">Name of the Assignment</option>
      <option value="Name of the Topic">Name of the Topic</option>
    </select>
  </div>

  <div class="form-group">
    <label>Assignment / Topic Name</label>
    <input type="text" id="topicName" value="Python List Methods: append,insert,remove,pop,sort,reverse">
  </div>

  <div class="form-group">
    <label>Date of Submission (DD/MM/YYYY)</label>
    <input type="text" id="submissionDate" value="27/10/2026">
  </div>

  <div class="section-title">Submitted By</div>
  <div class="form-group">
    <label>Student Name</label>
    <input type="text" id="studentName" value="Mir Shafayet Amin Aumio">
  </div>
  <div class="form-group">
    <label>ID Number</label>
    <input type="text" id="studentId" value="06226205101059">
  </div>

  <div class="section-title">Submitted To</div>
  <div class="form-group">
    <label>Instructor Name</label>
    <input type="text" id="teacherName" value="Mst. Anika Amzad">
  </div>
  <div class="form-group">
    <label>Instructor Designation</label>
    <input type="text" id="teacherDesig" value="Lecturer">
  </div>

  <div class="form-group">
    <label>Output PDF Filename</label>
    <input type="text" id="pdfName" value="Cover_Page.pdf">
  </div>

  <button id="generateBtn" disabled>Generate &amp; Download PDF</button>
  <div id="status">Initializing compiler...</div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('generateBtn');
  let typst = null;

  // The bundle is loaded as an ES module (deferred), so wait until it defines window.$typst
  function waitForTypst(timeoutMs = 20000) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      const timer = setInterval(() => {
        if (window.$typst) {
          clearInterval(timer);
          resolve(window.$typst);
        } else if (Date.now() - start > timeoutMs) {
          clearInterval(timer);
          reject(new Error('Typst bundle did not load (check your internet connection).'));
        }
      }, 100);
    });
  }

  async function initCompiler() {
    try {
      statusEl.innerText = "Loading Typst engine...";
      typst = await waitForTypst();

      // The lite bundle doesn't include the WASM modules, so tell it where to fetch them
      typst.setCompilerInitOptions({
        getModule: () =>
          'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler/pkg/typst_ts_web_compiler_bg.wasm',
      });
      typst.setRendererInitOptions({
        getModule: () =>
          'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer/pkg/typst_ts_renderer_bg.wasm',
      });

      // Warm-up compile: downloads the WASM compiler and fonts once, so the first real click is fast
      statusEl.innerText = "Warming up compiler (first load can take a few seconds)...";
      await typst.pdf({ mainContent: '#set page(width: 2cm, height: 2cm)\nok' });

      statusEl.innerText = "Ready to generate!";
      btn.disabled = false;
    } catch (err) {
      console.error(err);
      statusEl.innerText = "Failed to load compiler engine: " + err.message;
    }
  }

  window.addEventListener('DOMContentLoaded', initCompiler);

  // Escape characters that have special meaning in Typst markup so user input stays literal text
  function esc(str) {
    return String(str).replace(/([\\#$*_`@<>\[\]~\/"'=-])/g, '\\$1');
  }

  btn.addEventListener('click', async () => {
    if (!typst) return;

    btn.disabled = true;
    statusEl.innerText = "Fetching logo and compiling PDF...";

    try {
      // 1. Load logo into Typst's virtual file system (needs a local web server, not file://)
      let hasLogo = false;
      try {
        const imgRes = await fetch('image.png');
        if (!imgRes.ok) throw new Error('image.png not found');
        const imgBuffer = new Uint8Array(await imgRes.arrayBuffer());
        await typst.mapShadow('/image.png', imgBuffer);
        hasLogo = true;
      } catch (e) {
        console.warn('Logo skipped:', e);
      }

      // 2. Read form values (escaped)
      const v = id => esc(document.getElementById(id).value);
      const assignmentNo   = v('assignmentNo');
      const courseCode     = v('courseCode');
      const courseTitle    = v('courseTitle');
      const labelTitle     = v('labelTitle');
      const topicName      = v('topicName');
      const submissionDate = v('submissionDate');
      const studentName    = v('studentName');
      const studentId      = v('studentId');
      const teacherName    = v('teacherName');
      const teacherDesig   = v('teacherDesig');
      let pdfName = document.getElementById('pdfName').value.trim() || 'Cover_Page.pdf';
      if (!pdfName.toLowerCase().endsWith('.pdf')) pdfName += '.pdf';

      // 3. Typst source
      const logo = hasLogo
        ? `#align(center)[#image("image.png", width: 4cm)]`
        : '';

      const typstContent = `
#set page(paper: "a4")
${logo}

#align(center)[
  #set text(font: ("Maiandra GD", "Libertinus Serif"))
  == #text(size: 30pt, weight: "bold")[Khwaja Yunus Ali University]
  #v(0.2cm)
  #line(length: 100%)

  = ${assignmentNo}
]
#v(2cm)

#set text(size: 12pt)
#align(left)[
#grid(
  columns: (auto, auto, 1fr),
  row-gutter: 1.65em,
  column-gutter: 1em,

  strong([Name of the Department]), [:], [Computer Science and Engineering],
  strong([Course Code]),            [:], [${courseCode}],
  strong([Course Title]),           [:], [${courseTitle}],
  strong([${labelTitle}]),          [:], strong([${topicName}]),
  strong([Date of Submission]),     [:], [${submissionDate}],
)
]
#v(4.5cm)
#align(center)[
  #line(length: 50%)
  *Instructor signature and date*
]

#let header-brown = rgb("A45")

#table(
  columns: (1fr, 1fr),
  inset: (x: 15pt, y: 12pt),
  fill: (col, row) => if row == 0 { header-brown } else { none },

  stroke: (x, y) => if y == 0 {
    (top: .1pt + gray, left: 0pt + gray, right: 1pt + gray, bottom: none)
  } else {
    (
      bottom: 1pt + gray,
      left: 1pt + gray,
      right: if x == 0 { 0.5pt + gray } else { 1pt + gray }
    )
  },

  [#text(fill: white, weight: "bold")[Submitted by --]],
  [#text(fill: white, weight: "bold")[Submitted to --]],

  [
    *Name : ${studentName}* \\
    ID Number: ${studentId} \\
    Batch No: 22#super[nd] \\
    Semester: 1#super[st] Year 1#super[st] Semester \\
    Khwaja Yunus Ali University
  ],
  [
    *Name: ${teacherName}* \\
    ${teacherDesig} \\
    Dept. of CSE \\
    Khwaja Yunus Ali University
  ]
)
`;

      // 4. Compile straight to PDF bytes
      const pdfBytes = await typst.pdf({ mainContent: typstContent });

      // 5. Download
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = pdfName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      statusEl.innerText = hasLogo
        ? "PDF generated successfully!"
        : "PDF generated (logo skipped: image.png not found).";
    } catch (err) {
      console.error(err);
      statusEl.innerText = "Error compiling PDF. Check console.";
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
